# Configuração do núcleo devagent para este projeto.
# O núcleo (pasta devagent/) lê este arquivo e não conhece mais nada do produto.
# Para adotar o núcleo em outro projeto, veja devagent/README.md.

[projeto]
nome = "Painel B3"
# Repositório no GitHub.
repositorio = "frayel/devagent"
# URL publicada. A variável de ambiente PRODUCTION_URL tem precedência.
producao_url = "https://devagent-vb52.onrender.com"
# Fuso usado nos relatórios da auditoria.
fuso = "America/Sao_Paulo"
# Palavras do domínio que não podem aparecer dentro de devagent/.
# O teste devagent/tests/test_fronteira.py reprova o CI se aparecerem.
termos_do_dominio = [
  "B3",
  "Ibovespa",
  "IBOV",
  "BVSP",
  "pregão",
  "pregões",
  "investidor",
  "Yahoo",
  "Stooq",
  "yfinance",
  "cotação",
]

# Contrato entre o núcleo e o projeto: o CI, o guardião e o ciclo do agente
# só chamam estes comandos. O que cada alvo faz está no Makefile do projeto.
[verificacao]
verify = "make verify"
smoke = "make smoke"
audit = "make audit"

[saude]
# Página de saúde do produto em produção (ADR 016 do núcleo). O ciclo e o
# workflow de auditoria a leem para saber o que está quebrado.
caminho = "/api/sistema"
# Usuário do HTTP Basic; a senha vem de SAUDE_SENHA (igual a CONSULTOR_SENHA).
usuario = "consultor"

[deploy]
# Adaptador de plataforma usado pelo deploy-check.yml e pelo Passo 1.
adaptador = "render"

[disciplina]
# A partir desta spec, fechar como `done` exige o campo `aceite:` com o teste
# que prova a entrega (regra 7 do devagent/conferir_pr.py, ADR 018).
aceite_obrigatorio_desde = "084"
# A partir desta spec, o desenvolvimento só implementa a spec depois que a raia
# de revisão a marca com `revisada:` no cabeçalho (ADR 021 do núcleo).
revisao_obrigatoria_desde = "084"
# A partir desta spec, spec nova de PR `spec:` declara `origem:` e o item da
# Fila do backlog de onde veio sai no mesmo PR (regra 10 do devagent/conferir_pr.py).
origem_obrigatoria_desde = "161"

[enxuto]
# Regra 11 do devagent/conferir_pr.py: só estes arquivos ficam na raiz. Arquivo
# novo na raiz entra aqui, no mesmo PR, com o motivo; sobra de sessão sai.
raiz = [
  ".gitignore",
  "AGENTS.md",        # porta de entrada dos agentes
  "CHANGELOG.md",
  "Makefile",         # contrato de verificação (make verify, smoke, audit)
  "PRODUTO.md",       # o que o agente constrói
  "README.md",
  "devagent.toml",    # liga o núcleo ao projeto
  "pyproject.toml",   # configuração do pytest e do mypy
  "render.yaml",      # deploy no Render
  "requirements-dev.txt",
  "requirements.txt",
]
# Pastas aposentadas: os diários dos especialistas foram para docs/diarios/.
pastas_proibidas = [".jules/", ".agents/"]
