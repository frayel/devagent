apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: web
  name: web-ing
  namespace: painelb3
  annotations:
    # ClusterIssuer já existente no cluster (o mesmo do dux).
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecAuditEngine RelevantOnly
      SecRule REQUEST_URI "@rx (?i)(\.env|\.git|wp-.*|wp-includes|\.php|sitemap_index\.xml)" \
        "id:1000001,phase:1,deny,status:403,log,msg:Acesso bloqueado a caminho restrito/scanner"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - painelb3.host.placeholder
      secretName: painelb3-tls
  rules:
    - host: "painelb3.host.placeholder"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: web-svc
                port:
                  number: 8000
