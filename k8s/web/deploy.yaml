apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
  namespace: painelb3
spec:
  # Uma réplica só: a coleta roda dentro do processo (app/agendador.py, ADR 004).
  # Duas réplicas coletariam em dobro e gastariam a cota da brapi e do Gemini.
  # Por isso não há HPA, ao contrário do padrão do dux.
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A réplica nova sobe antes de a antiga sair: sem queda no deploy,
      # com uma sobreposição de segundos entre os dois agendadores.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/frayel/devagent/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: secret-store
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
      restartPolicy: Always
