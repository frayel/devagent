<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel B3</title>
    <link rel="stylesheet" href="/static/tema.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="/static/graficos.js"></script>
</head>
<body>
    <header>
        <div class="marca">Painel <span>B3</span></div>
        <div class="pregao">Pregão</div>
        <div class="hora">{{ data.time if data else '' }}</div>
    </header>

    <main class="grade">
        {% block content %}{% endblock %}
    </main>

    <footer>
        Conteúdo informativo gerado automaticamente. Não constitui recomendação de investimento.
    </footer>

    <script>
      // Barras proporcionais nas tabelas
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('tbody[data-rank]').forEach(tb => {
          const is = [...tb.querySelectorAll('i[data-v]')];
          if (!is.length) return;
          const max = Math.max(...is.map(i => parseFloat(i.dataset.v)));
          if (max === 0) return;
          is.forEach(i => i.style.width = (18 + 70 * (parseFloat(i.dataset.v) / max)) + '%');
        });
      });
    </script>
</body>
</html>
