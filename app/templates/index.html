{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Ibovespa Hoje</h2>

    {% if data %}
        <div style="font-size: 2em; font-weight: bold;">
            {{ data.current_price }} pontos
        </div>

        <div style="font-size: 1.2em; margin-top: 5px;"
             class="{% if data.is_positive %}positive{% elif data.is_negative %}negative{% else %}neutral{% endif %}">
            {{ data.variation }} ({{ data.variation_percent }})
        </div>

        <div class="text-small" style="margin-top: 10px;">
            Última atualização: {{ data.time }}
        </div>

        <div id="ibov-chart" style="width: 100%; height: 300px; margin-top: 20px;"></div>

        <script>
            const historyData = {{ data.history_json | safe }};
            const trace = {
                x: historyData.dates,
                y: historyData.closes,
                type: 'scatter',
                mode: 'lines',
                line: {
                    color: '{{ "#28a745" if data.is_positive else "#dc3545" if data.is_negative else "#6c757d" }}',
                    width: 2
                }
            };
            const layout = {
                margin: { t: 10, r: 10, l: 40, b: 30 },
                xaxis: { showgrid: false },
                yaxis: { showgrid: true, gridcolor: '#eee' },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)'
            };
            Plotly.newPlot('ibov-chart', [trace], layout, {displayModeBar: false});
        </script>
    {% else %}
        <p>Dados não disponíveis no momento.</p>
    {% endif %}
</div>
{% endblock %}
