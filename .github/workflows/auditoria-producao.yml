name: Auditoria de produção

# Confere o site publicado contra fontes independentes e regras de plausibilidade
# (make audit: harness em devagent/auditoria/nucleo.py, checagens do produto em
# auditoria/auditar.py). Se algo estiver errado, abre uma issue
# `producao-incorreta`; quando a auditoria volta a passar, fecha a issue.
on:
  schedule:
    # Horários do projeto. Pregão da B3: 10h às 17h BRT (13h às 20h UTC), mais o pós-fechamento.
    - cron: "7,37 13-21 * * 1-5"
    # Antes da abertura: confere o fechamento do dia anterior.
    - cron: "23 11 * * 1-5"
    # Fim de semana: uma vez por dia.
    - cron: "41 14 * * 0,6"
  # Disparado pelo deploy-check.yml quando um deploy fica live.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: auditoria-producao
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Auditar
        id: auditoria
        env:
          # Vazio: o auditor usa producao_url do devagent.toml.
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set +e
          make audit PY=python ARGS="--navegador --saida relatorio"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat relatorio/relatorio.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Guardar evidências
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ github.run_id }}
          path: relatorio/
          retention-days: 30

      - name: Abrir ou atualizar issue
        if: steps.auditoria.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create producao-incorreta --color D93F0B \
            --description "Produção exibe dado errado ou está fora do ar" 2>/dev/null || true
          falhas=$(python3 -c "import json;d=json.load(open('relatorio/relatorio.json'));print(' '.join(sorted(r['id'] for r in d['resultados'] if r['status']=='falha')))")
          body=$(printf '%s\n\nEvidências (relatório JSON e screenshot): %s\n\nO agente trata esta issue no Passo 1 de devagent/CICLO.md. Não altere a auditoria para fazê-la passar.\n\n<!-- falhas: %s -->' \
            "$(cat relatorio/relatorio.md)" "$RUN_URL" "$falhas")
          # Só a issue aberta por este workflow (título "Produção incorreta").
          # As issues do auditor LLM também têm o label, mas não são o alvo.
          existing=$(gh issue list --label producao-incorreta --state open --json number,title \
            -q '[.[] | select(.title | startswith("Produção incorreta"))] | sort_by(.number) | .[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Produção incorreta: $falhas" --label producao-incorreta --body "$body"
          else
            # Comenta quando o conjunto de falhas muda, ou quando um PR declarou
            # corrigir a issue depois da última notificação e produção continua
            # falhando (para a correção malsucedida ficar visível na issue).
            decisao=$(gh issue view "$existing" --json body,comments | FALHAS="$falhas" python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          textos = [d.get("body") or ""] + [c.get("body") or "" for c in d.get("comments", [])]
          marca = "<!-- falhas: "
          ultimo = max((i for i, t in enumerate(textos) if marca in t), default=-1)
          if ultimo < 0:
              print("comentar"); sys.exit()
          anterior = textos[ultimo].split(marca, 1)[1].split(" -->", 1)[0]
          correcao = any("<!-- correcao-mergeada -->" in t for t in textos[ultimo + 1:])
          if anterior != os.environ["FALHAS"]:
              print("comentar")
          elif correcao:
              print("correcao-falhou")
          else:
              print("manter")
          ')
            case "$decisao" in
              comentar)
                gh issue comment "$existing" --body "$body"
                gh issue edit "$existing" --title "Produção incorreta: $falhas" ;;
              correcao-falhou)
                gh issue comment "$existing" --body "$(printf '**A correção mergeada não resolveu:** produção continua com as mesmas falhas.\n\n%s' "$body")" ;;
              *) echo "Mesmas falhas da última notificação; issue #$existing mantida." ;;
            esac
          fi

      - name: Fechar issue se produção voltou ao normal
        if: steps.auditoria.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label producao-incorreta --state open --json number,title \
                      -q '.[] | select(.title | startswith("Produção incorreta")) | .number'); do
            gh issue close "$n" --comment "Auditoria passou em $RUN_URL."
          done
