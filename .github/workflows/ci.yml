name: CI

# Núcleo devagent: o CI só conhece os alvos do Makefile (contrato do projeto).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Regras do ciclo que o agente esquecia (devagent/conferir_pr.py, ADR 008).
  # Só biblioteca padrão; compara o PR com a base.
  disciplina:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Conferir disciplina do ciclo
      run: python -m devagent.conferir_pr

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Instalar dependências
      run: make install
    - name: Verificar (make verify)
      run: make verify

  # Reproduz o ambiente de produção: só as dependências de produção,
  # o mesmo comando de início e o mesmo health check (make smoke).
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Instalar só dependências de produção
      run: make install-prod
    - name: Subir e conferir health check (make smoke)
      env:
        PORT: "8000"
      run: make smoke
