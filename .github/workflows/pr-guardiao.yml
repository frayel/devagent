name: Guardião de PRs

# Impede que PRs do agente fiquem travados. Regras em scripts/guardiao_prs.py
# e docs/skills/destravar-pr.md.
on:
  workflow_run:
    workflows: [CI, Auto-merge]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr-guardiao
  cancel-in-progress: false

jobs:
  ci-falhou:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/guardiao_prs.py
          --ci-falhou "${{ github.event.workflow_run.head_branch }}"
          --run-id "${{ github.event.workflow_run.id }}"

  varredura:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'Auto-merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "guardiao-prs"
          git config user.email "guardiao-prs@users.noreply.github.com"
          cp scripts/guardiao_prs.py "$RUNNER_TEMP/guardiao.py"
          python3 "$RUNNER_TEMP/guardiao.py" --varredura
