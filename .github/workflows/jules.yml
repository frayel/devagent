name: Jules

# Dispara o desenvolvedor e os especialistas (Sentinel, Palette, Bolt) pela API do Jules e destrava sessões que
# pararem esperando aprovação de plano ou resposta a uma pergunta.
# Substitui a tarefa agendada criada pela interface web, que pode parar em
# "aguardando aprovação" mesmo com o prompt pedindo o contrário.
#
# ARQUIVO PROTEGIDO: mudanças exigem revisão humana.
on:
  schedule:
    # Horários em UTC (BRT = UTC-3). Um disparo a cada 2 horas, 24 h por dia:
    # 9 para o desenvolvedor e 1 por dia para cada especialista.
    - cron: "5 0,2,4,8,10,14,16,20,22 * * *" # desenvolvedor
    - cron: "5 6 * * *" # seguranca (Sentinel), 03h05 BRT
    - cron: "5 12 * * *" # performance (Bolt), 09h05 BRT
    - cron: "5 18 * * *" # design (Palette), 15h05 BRT
    # Destravar: a cada 15 minutos (o GitHub pode atrasar ou pular
    # agendamentos curtos em horários de pico; cada disparo acima
    # também destrava).
    - cron: "*/15 * * * *"
  # Execução manual. O auditor LLM também é agendado pelo auditoria-llm.yml;
  # disparar pelos dois lugares é seguro, porque jules.py não cria sessão
  # nova se já houver uma ativa da mesma persona.
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [desenvolvedor, seguranca, design, performance, auditor, destravar, listar]
        default: desenvolvedor

permissions:
  contents: read

concurrency:
  group: jules
  cancel-in-progress: false

jobs:
  jules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Executar
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::Crie o secret JULES_API_KEY (https://jules.google.com/settings#api)."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            acao="${{ inputs.acao }}"
          else
            case "${{ github.event.schedule }}" in
              "*/15 * * * *") acao="destravar" ;;
              "5 6 * * *") acao="seguranca" ;;
              "5 12 * * *") acao="performance" ;;
              "5 18 * * *") acao="design" ;;
              *) acao="desenvolvedor" ;;
            esac
          fi
          case "$acao" in
            destravar|listar) python3 scripts/jules.py "$acao" ;;
            *) python3 scripts/jules.py iniciar "$acao" && python3 scripts/jules.py destravar ;;
          esac
