name: Jules

# Dispara o desenvolvedor e os especialistas (Sentinel, Palette, Bolt) pela API do Jules
# e destrava sessões paradas esperando aprovação de plano ou resposta.
# O agendamento faz uma "rodada": inicia a persona da hora (se ainda não
# começou nesta hora) e destrava sessões paradas, depois encerra. Cada execução
# leva menos de 1 minuto; nada fica rodando entre uma e outra. O antigo job
# "vigia", um laço de ~5h40, foi removido porque cobrava minutos parado.
# Ressalva: o cron do GitHub descarta parte dos disparos agendados; se isso
# atrasar demais, um relógio externo pode chamar workflow_dispatch com
# acao=rodada, que não é descartado.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [rodada, desenvolvedor, seguranca, design, performance, auditor, destravar, listar, encerrar]
        default: rodada
      sessao:
        description: "Só para encerrar: id da sessão ou URL da tarefa no Jules"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  avulso:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: jules
      cancel-in-progress: false
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      JULES_LIMITE_DIARIO: ${{ vars.JULES_LIMITE_DIARIO }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Executar
        env:
          ACAO: ${{ inputs.acao || 'rodada' }}
          SESSAO: ${{ inputs.sessao }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::Crie o secret JULES_API_KEY (https://jules.google.com/settings#api)."
            exit 0
          fi
          case "$ACAO" in
            rodada|destravar|listar) python3 -m devagent.adaptadores.jules "$ACAO" ;;
            encerrar) python3 -m devagent.adaptadores.jules encerrar "$SESSAO" ;;
            *) python3 -m devagent.adaptadores.jules iniciar "$ACAO" && python3 -m devagent.adaptadores.jules destravar ;;
          esac
