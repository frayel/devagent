name: Jules

# Dispara o desenvolvedor e os especialistas (Sentinel, Palette, Bolt) pela API do Jules e destrava sessões que
# pararem esperando aprovação de plano ou resposta a uma pergunta.
# Substitui a tarefa agendada criada pela interface web, que pode parar em
# "aguardando aprovação" mesmo com o prompt pedindo o contrário.
#
# ARQUIVO PROTEGIDO: mudanças exigem revisão humana.
on:
  schedule:
    # Horários em UTC (BRT = UTC-3). Minutos quebrados de propósito: o GitHub
    # atrasa e descarta mais os agendamentos perto da virada da hora.
    # Um disparo por hora, 24 h por dia:
    # 21 para o desenvolvedor e, nas horas 6, 12 e 18, um para cada especialista.
    # Se a sessão anterior do desenvolvedor ainda estiver ativa, o disparo é pulado.
    # Com o repo variable JULES_LIMITE_DIARIO, o desenvolvedor para antes de
    # consumir a cota reservada aos especialistas e ao auditor.
    - cron: "47 0-5,7-11,13-17,19-23 * * *" # desenvolvedor
    - cron: "47 6 * * *" # seguranca (Sentinel), 03h47 BRT
    - cron: "47 12 * * *" # performance (Bolt), 09h47 BRT
    - cron: "47 18 * * *" # design (Palette), 15h47 BRT
    # Destravar: a cada 15 minutos (o GitHub pode atrasar ou pular
    # agendamentos curtos em horários de pico; cada disparo acima
    # também destrava).
    - cron: "4,19,34,49 * * * *"
  # Execução manual. O auditor LLM também é agendado pelo auditoria-llm.yml;
  # disparar pelos dois lugares é seguro, porque jules.py não cria sessão
  # nova se já houver uma ativa da mesma persona.
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [desenvolvedor, seguranca, design, performance, auditor, destravar, listar]
        default: desenvolvedor

permissions:
  contents: read

concurrency:
  group: jules
  cancel-in-progress: false

jobs:
  jules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      JULES_LIMITE_DIARIO: ${{ vars.JULES_LIMITE_DIARIO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Executar
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::Crie o secret JULES_API_KEY (https://jules.google.com/settings#api)."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            acao="${{ inputs.acao }}"
          else
            case "${{ github.event.schedule }}" in
              "4,19,34,49 * * * *") acao="destravar" ;;
              "47 6 * * *") acao="seguranca" ;;
              "47 12 * * *") acao="performance" ;;
              "47 18 * * *") acao="design" ;;
              *) acao="desenvolvedor" ;;
            esac
          fi
          case "$acao" in
            destravar|listar) python3 scripts/jules.py "$acao" ;;
            *) python3 scripts/jules.py iniciar "$acao" && python3 scripts/jules.py destravar ;;
          esac
