name: Jules

# Dispara o desenvolvedor e os especialistas (Sentinel, Palette, Bolt) pela API do Jules
# e destrava sessões paradas esperando aprovação de plano ou resposta.
# Só roda manualmente: o job "vigia" contínuo foi removido para não consumir
# minutos do GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [desenvolvedor, seguranca, design, performance, auditor, destravar, listar, encerrar]
        default: desenvolvedor
      sessao:
        description: "Só para encerrar: id da sessão ou URL da tarefa no Jules"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  avulso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: jules
      cancel-in-progress: false
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      JULES_LIMITE_DIARIO: ${{ vars.JULES_LIMITE_DIARIO }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Executar
        env:
          ACAO: ${{ inputs.acao }}
          SESSAO: ${{ inputs.sessao }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::Crie o secret JULES_API_KEY (https://jules.google.com/settings#api)."
            exit 0
          fi
          case "$ACAO" in
            destravar|listar) python3 -m devagent.adaptadores.jules "$ACAO" ;;
            encerrar) python3 -m devagent.adaptadores.jules encerrar "$SESSAO" ;;
            *) python3 -m devagent.adaptadores.jules iniciar "$ACAO" && python3 -m devagent.adaptadores.jules destravar ;;
          esac
