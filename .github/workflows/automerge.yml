name: Auto-merge

# Faz squash merge de qualquer PR assim que o workflow CI passa.
# O Jules abre PRs mas não faz merge; este workflow fecha o ciclo.
# Exceção: PRs que alteram caminhos de devagent/protegidos.txt ficam com label
# `revisao-humana`. A lista é lida da main, nunca do PR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write # sem isto o gh issue view/close falha e as issues citadas nunca fecham

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: devagent/protegidos.txt
          sparse-checkout-cone-mode: false

      - name: Merge do PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then echo "Nenhum PR aberto para $BRANCH"; exit 0; fi

          # Quem é vigiado não altera quem vigia: PRs que mexem nos caminhos de
          # devagent/protegidos.txt (lido da main) esperam revisão humana.
          padroes="$RUNNER_TEMP/protegidos.txt"
          grep -vE '^[[:space:]]*(#|$)' devagent/protegidos.txt > "$padroes" 2>/dev/null || true
          if [ -s "$padroes" ]; then
            protegidos=$(gh pr diff "$pr" -R "$GITHUB_REPOSITORY" --name-only \
              | grep -E -f "$padroes" || true)
          else
            # Sem a lista, ninguém sabe o que é protegido: na dúvida, não faz merge.
            protegidos="devagent/protegidos.txt ausente ou vazio na main"
          fi
          if [ -n "$protegidos" ]; then
            gh label create revisao-humana -R "$GITHUB_REPOSITORY" --color FBCA04 \
              --description "Mexe em caminho protegido; merge só com aprovação humana" 2>/dev/null || true
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --add-label revisao-humana
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "$(printf 'Merge automático suspenso: este PR altera caminhos protegidos (devagent/protegidos.txt).\n\n```\n%s\n```\n\nUm humano precisa revisar e fazer o merge.' "$protegidos")"
            exit 0
          fi

          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --squash --delete-branch

          # O GitHub não fecha de forma confiável as issues citadas com
          # "Closes #N" quando o merge é feito pelo GITHUB_TOKEN. Fechamos aqui.
          # Issues de produção (deploy-falhou, producao-incorreta) só fecham
          # quando a verificação passa: recebem um aviso e ficam abertas.
          # Procura as palavras-chave no título, no corpo e nas mensagens dos commits.
          corpo=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json title,body,commits \
            -q '[.title, (.body // ""), (.commits[] | .messageHeadline + " " + .messageBody)] | join("\n")')
          for n in $(printf '%s' "$corpo" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+#[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
            info=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state,labels \
              -q '.state + " " + ([.labels[].name] | join(","))') \
              || { echo "::warning::Não consegui ler a issue #$n citada no PR #$pr."; continue; }
            case "$info" in
              OPEN*deploy-falhou*|OPEN*producao-incorreta*)
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$(printf 'O PR #%s, que declara corrigir esta issue, foi mergeado. Ela fecha sozinha quando a verificação de produção passar; se continuar falhando, a auditoria avisa aqui.\n\n<!-- correcao-mergeada -->' "$pr")" ;;
              OPEN*)
                gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Fechada pelo PR #$pr, mergeado na main." ;;
            esac
          done

          # Achados do auditor LLM viram issues logo após o merge.
          title=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json title -q .title)
          case "$title" in
            auditoria:*) gh workflow run auditoria-achados.yml -R "$GITHUB_REPOSITORY" --ref main ;;
          esac
