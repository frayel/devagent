name: Auto-merge

# Faz squash merge de qualquer PR assim que o workflow CI passa.
# O Jules abre PRs mas não faz merge; este workflow fecha o ciclo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge do PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then echo "Nenhum PR aberto para $BRANCH"; exit 0; fi
          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --squash --delete-branch
