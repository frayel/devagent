name: Auto-merge

# Faz squash merge de qualquer PR assim que o workflow CI passa.
# O Jules abre PRs mas não faz merge; este workflow fecha o ciclo.
# Não há caminhos protegidos nem revisão humana: todo PR com CI verde entra
# (ADR 007).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write # sem isto o gh issue view/close falha e as issues citadas nunca fecham

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # PR feito sobre uma versão velha de uma spec que a main já mudou é
      # redundante: fecha em vez de mesclar (ADR 024, #542 e #543).
      - name: Conferir redundância
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name "automerge"
          git config user.email "automerge@users.noreply.github.com"
          cp -r devagent "$RUNNER_TEMP/devagent"
          codigo=0
          PYTHONPATH="$RUNNER_TEMP" python3 -P -m devagent.guardiao_prs --antes-do-merge "$BRANCH" || codigo=$?
          # 10 = fechado como redundante; outro erro não segura o merge.
          if [ "$codigo" -eq 10 ]; then echo "redundante=1" >> "$GITHUB_ENV"; fi
      - name: Merge do PR
        if: env.redundante != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then echo "Nenhum PR aberto para $BRANCH"; exit 0; fi

          # Segunda trava contra PR vazio (a primeira é a regra 5 do
          # devagent/conferir_pr.py). O PR #171 entrou vazio como "Spec 027a".
          arquivos=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json files -q '.files | length')
          if [ "${arquivos:-0}" -eq 0 ]; then
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch --comment "Fechado sem merge: o PR não altera nenhum arquivo. Um PR vazio não entrega a spec; ela continua pendente."
            exit 0
          fi

          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --squash --delete-branch

          # O GitHub não fecha de forma confiável as issues citadas com
          # "Closes #N" quando o merge é feito pelo GITHUB_TOKEN. Fechamos aqui.
          # Issues de produção (deploy-falhou, producao-incorreta, sistema-com-problema) só fecham
          # quando a verificação passa: recebem um aviso e ficam abertas.
          # Procura as palavras-chave no título, no corpo e nas mensagens dos commits.
          corpo=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json title,body,commits \
            -q '[.title, (.body // ""), (.commits[] | .messageHeadline + " " + .messageBody)] | join("\n")')
          for n in $(printf '%s' "$corpo" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+#[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
            info=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state,labels \
              -q '.state + " " + ([.labels[].name] | join(","))') \
              || { echo "::warning::Não consegui ler a issue #$n citada no PR #$pr."; continue; }
            case "$info" in
              OPEN*deploy-falhou*|OPEN*producao-incorreta*|OPEN*sistema-com-problema*)
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$(printf 'O PR #%s, que declara corrigir esta issue, foi mergeado. Ela fecha sozinha quando a verificação de produção passar; se continuar falhando, a auditoria avisa aqui.\n\n<!-- correcao-mergeada -->' "$pr")" ;;
              OPEN*)
                gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Fechada pelo PR #$pr, mergeado na main." ;;
            esac
          done

          # Achados do auditor LLM e do verificador geral viram issues logo após o merge.
          title=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json title -q .title)
          case "$title" in
            auditoria:*|verificação:*|verificacao:*|Verificação:*|Verificacao:*)
              gh workflow run auditoria-achados.yml -R "$GITHUB_REPOSITORY" --ref main ;;
          esac
