services:
  - type: web
    name: b3-dashboard
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Endereço e chave da mt5api ficam só no painel do Render, nunca no repositório.
      - key: MT5_API_URL
        sync: false
      - key: MT5_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAPI_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
